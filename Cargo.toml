[workspace]
resolver = "2"
members = ["crates/mcode-core", "crates/mcode-cli"]

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 内核依赖（与 MCode_Desktop/mcode-core 保持同版本基线）
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
similar = "2"          # diff 算法（edit_file 卡片渲染源）
globset = "0.4"        # glob 匹配（glob/grep include 工具）
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
walkdir = "2"

# CLI 依赖
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
